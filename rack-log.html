<title>Rack Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --keyboard-inset:0px; --sheet-vh:100dvh;
  --bg:#F2F3F5; --frame:#E4E6EB;
  --surface:#FFFFFF; --surface-2:#E9EBEF; --surface-3:#DFE2E8;
  --ink:#16181D; --ink-2:#565C68; --ink-3:#878E9C;
  --line:#DCDFE5; --line-2:#C8CCD4;
  --accent:#C8372A; --on-accent:#FFFFFF; --on-chip:#FFFFFF;
  --push:#C8372A; --pull:#2C5FBF; --legs:#8F6714; --cardio:#2E7D4F; --other:#5B6472;
  --upper:#6B4FA1; --lower:#68752B; --full:#9A4F2E;
  /* people, deliberately off the bumper-plate hues so a person's disc is never
     mistaken for a split colour */
  --p1:#6B5B95; --p2:#2F7C82; --p3:#8A4A6B;
  --shadow:0 1px 2px rgba(22,24,29,.06),0 8px 24px rgba(22,24,29,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --frame:#0A0B0E;
    --surface:#181B21; --surface-2:#21252D; --surface-3:#2A2F38;
    --ink:#EDEFF3; --ink-2:#A2AAB8; --ink-3:#6E7684;
    --line:#2A2F38; --line-2:#39404B;
    --accent:#E85B47; --on-accent:#16181D; --on-chip:#101216;
    --push:#E85B47; --pull:#5B8DEF; --legs:#E0A93F; --cardio:#4FBF83; --other:#8A93A2;
    --upper:#A98AE2; --lower:#B7C85A; --full:#E58A5F;
    --p1:#9E8FCB; --p2:#4FA8AE; --p3:#C07A99;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --frame:#0A0B0E;
  --surface:#181B21; --surface-2:#21252D; --surface-3:#2A2F38;
  --ink:#EDEFF3; --ink-2:#A2AAB8; --ink-3:#6E7684;
  --line:#2A2F38; --line-2:#39404B;
  --accent:#E85B47; --on-accent:#16181D; --on-chip:#101216;
  --push:#E85B47; --pull:#5B8DEF; --legs:#E0A93F; --cardio:#4FBF83; --other:#8A93A2;
  --upper:#A98AE2; --lower:#B7C85A; --full:#E58A5F;
  --p1:#9E8FCB; --p2:#4FA8AE; --p3:#C07A99;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--frame);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

#app{max-width:420px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  position:relative;display:flex;flex-direction:column;overflow:hidden}
/* phone: pin the app to the real viewport so only .scroll scrolls and the
   action bar never rides below the browser's collapsing URL bar */
@media (max-width:519px){
  html,body{height:100%}
  #app{height:100vh;height:100dvh}
}
@media (min-width:520px){
  body{padding:24px 0}
  #app{min-height:min(880px,calc(100vh - 48px));height:min(880px,calc(100vh - 48px));
    border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
}
/* #view holds the header + the scroll region; it has to be a flex column of its
   own, and both it and .scroll need min-height:0 or they refuse to shrink below
   their content and nothing scrolls. */
#view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:0 16px 24px}

.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  letter-spacing:.01em;text-wrap:balance}
h1{font-size:30px;line-height:1.05;text-transform:uppercase}
h2{font-size:21px;line-height:1.1}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

header{padding:18px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.back{display:flex;align-items:center;gap:6px;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ink-2);
  padding:6px 8px;margin:-6px -8px}
.back:hover{color:var(--accent)}
.headacts{display:flex;align-items:center;gap:10px}
.shareicon{width:40px;height:40px;display:grid;place-items:center;border-radius:9px;
  background:var(--surface-2);color:var(--ink);line-height:1}
.shareicon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.shareicon:hover{background:var(--surface-3);color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:3px;color:var(--on-chip);background:var(--c);flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
[data-split="push"]{--c:var(--push)}
[data-split="pull"]{--c:var(--pull)}
[data-split="legs"]{--c:var(--legs)}
[data-split="cardio"]{--c:var(--cardio)}
[data-split="other"]{--c:var(--other)}
[data-split="upper"]{--c:var(--upper)}
[data-split="lower"]{--c:var(--lower)}
[data-split="full"]{--c:var(--full)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px;display:block;width:100%;text-align:left}
button.card{transition:border-color .12s,transform .06s}
button.card:hover{border-color:var(--line-2)}
button.card:active{transform:scale(.995)}
.list{display:flex;flex-direction:column;gap:10px}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:10px}

.sessionmeta{color:var(--ink-3);font-size:13px;margin-top:6px}
.exlist{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:5px}
.exline{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.exline b{font-weight:500;color:var(--ink)}
.exline span{color:var(--ink-3);font-size:13px;white-space:nowrap}

/* crew feed: Mine/Crew switch, and the person on a shared card */
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(10,11,14,.13)}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--p);
  color:var(--on-chip);display:flex;align-items:center;justify-content:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.03em}
.who .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .you{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);flex:none;
  border:1px solid var(--line-2);border-radius:3px;padding:1px 4px}
/* you are not one of the colours: an ink disc can't be mistaken for a split
   the way an accent-red one reads as Push */
[data-person="me"]{--p:var(--ink)}
[data-person="p1"]{--p:var(--p1)}
[data-person="p2"]{--p:var(--p2)}
[data-person="p3"]{--p:var(--p3)}
.fromline{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.social{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:6px}
.act{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:8px;
  background:var(--surface-2);color:var(--ink-3);font-family:"Barlow Condensed",sans-serif;
  font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.act:hover{color:var(--ink)}
.act[aria-pressed="true"],.act[aria-expanded="true"]{color:var(--accent)}
.act .n{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px}
.act.grow{margin-left:auto;background:var(--surface-3);color:var(--ink)}
.act.grow:hover{background:var(--accent);color:var(--on-accent)}
.thread{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.cmt{display:flex;gap:8px;align-items:flex-start}
.cmt .avatar{width:24px;height:24px;font-size:10px;margin-top:1px}
.cmt .body{font-size:14px;line-height:1.45;min-width:0;color:var(--ink-2)}
.cmt .body b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin-right:6px}
.cbox{display:flex;gap:8px}
.cbox input{flex:1;min-width:0;height:40px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);padding:0 12px;font-size:16px}
.cbox input::placeholder{color:var(--ink-3)}
.cbox button{flex:none;height:40px;padding:0 14px;border-radius:9px;background:var(--accent);
  color:var(--on-accent);font-family:"Barlow Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:13px}

.bar{flex:none;position:sticky;bottom:0;z-index:4;
  border-top:1px solid var(--line);background:var(--surface);
  box-shadow:0 -10px 22px -14px rgba(10,11,14,.35);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.tab{flex:1;padding:9px 4px;border-radius:9px;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--ink-3)}
.tab[aria-current="true"]{color:var(--ink);background:var(--surface-2)}
.btn{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:12px 18px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;font-size:15px;min-height:46px}
.btn:active{filter:brightness(.94)}
.btn.wide{flex:1}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.link{display:flex;align-items:center;justify-content:center;text-decoration:none}
.orline{display:flex;align-items:center;gap:10px;margin:14px 0 10px;
  font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:12px;color:var(--ink-3)}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

.empty{text-align:center;color:var(--ink-3);padding:44px 20px;font-size:14px;line-height:1.6}

/* the door: the only thing on screen until the server says who you are */
.bootscreen{flex:1;background:#16181D}
.gate{max-width:320px;margin:0 auto;padding:12vh 0 40px;text-align:center}
.brandmark{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:36px;
  line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.brandmark s{display:block;text-decoration:none;height:4px;width:46px;margin:10px auto 0;
  border-radius:2px;background:var(--accent)}
.gatesub{color:var(--ink-2);font-size:13px;line-height:1.55;margin:16px 0 22px}
.gateswap{color:var(--ink-3);font-size:12.5px;margin:14px 0 0;text-align:center}
.link2{background:none;border:0;padding:0;color:var(--accent);font:inherit;
  font-weight:600;cursor:pointer;text-decoration:underline}
.gate .msg{text-align:center}
/* the signed-in person, where the Data button used to be */
/* a screen reached from the calendar stacks its back button over the title */
header .back+h1{margin-top:8px}
/* the crew roster: everyone with an account, whether they have shared or not */
.roster{border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:12px 14px;margin-bottom:12px}
.rosterrow{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:9px}
.rosterrow .who{gap:7px}
.rosterrow .avatar{width:28px;height:28px;font-size:12px}
.rosterrow .nm{font-size:16px}
.rosternote{margin:11px 0 0;color:var(--ink-3);font-size:12.5px;line-height:1.55}
/* finding people, on the crew tab */
.crewbar{display:flex;gap:8px;margin-bottom:12px}
.crewbar .search{flex:1}
.crewbar .btn{flex:none;width:auto;padding:0 16px;height:44px}
.findlist{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.findrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);padding:10px 12px}
.findrow .at{display:block;color:var(--ink-3);font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.findrow .nm{line-height:1.15}
.follow{flex:none;padding:7px 13px;border-radius:999px;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;
  background:var(--accent);color:#10121a;border:1px solid var(--accent)}
.follow.on{background:transparent;color:var(--ink-2);border-color:var(--line)}
.rosternote code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.exq{margin-bottom:12px}
/* invites, on the profile screen */
.invitenew{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.invitenew .fld{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.invlist{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.invrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);padding:10px 12px}
.invrow b{display:block;font-weight:600;font-size:13px}
.invrow span{display:block;color:var(--ink-3);font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.invrow .act{flex:none;padding:6px 10px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ink-2)}
.userbtn{display:flex;align-items:center;padding:4px 0;margin:0}
.userbtn .who{position:relative}
.userbtn .avatar{width:28px;height:28px;font-size:12px}
.userbtn .nm{font-size:16px}
.userbtn:hover .nm{color:var(--accent)}
.notifybadge{position:absolute;top:-7px;left:18px;min-width:17px;height:17px;padding:0 4px;
  box-sizing:border-box;border-radius:9px;background:var(--accent);color:var(--on-accent);
  border:2px solid var(--bg);font:700 10px/13px ui-monospace,SFMono-Regular,Menlo,monospace;
  text-align:center}
.notice-list{display:flex;flex-direction:column;gap:8px}
.notice{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.notice.unread{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.notice .avatar{flex:none;width:31px;height:31px;font-size:11px}
.notice-copy{min-width:0;flex:1;color:var(--ink-2);font-size:13px;line-height:1.4}
.notice-copy b{color:var(--ink);font-weight:600}.notice-copy small{display:block;margin-top:4px;
  color:var(--ink-3);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}

.datasec{margin-bottom:28px}
.datasec p{margin:6px 0 12px;color:var(--ink-2);font-size:13px;line-height:1.55}
.prefrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  text-align:left;font-size:14px;font-weight:500}
.prefstate{flex:none;min-width:38px;padding:4px 8px;border-radius:999px;text-align:center;
  background:var(--surface-2);color:var(--ink-3);font-family:"Barlow Condensed",sans-serif;
  font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.prefrow[aria-pressed="true"] .prefstate{background:var(--accent);color:var(--on-accent)}
.fld{display:block;width:100%;box-sizing:border-box;margin-bottom:8px;padding:11px 12px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;
  font-family:"Barlow",sans-serif;font-size:16px}
.fld:focus{outline:2px solid var(--accent);outline-offset:-2px}
.msg{margin-top:10px;font-size:13px;line-height:1.5;color:var(--ink-2);min-height:1px}
.msg.bad{color:var(--accent)}

.livehead{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:12px;border-left:3px solid var(--c)}
.splitpick{margin-top:16px;position:relative}
.splitlabel{display:block;margin-bottom:6px;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.splitselect{position:relative}
.splittrigger{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);text-align:left}
.splittrigger:hover,.splittrigger[aria-expanded="true"]{border-color:var(--accent)}
.splittrigger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.splitdot{width:10px;height:10px;border-radius:50%;background:var(--split-color);flex:none}
.splitvalue{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;
  letter-spacing:.02em;color:var(--ink)}
.splitpick[data-split="push"]{--split-color:var(--push)}
.splitpick[data-split="pull"]{--split-color:var(--pull)}
.splitpick[data-split="legs"]{--split-color:var(--legs)}
.splitpick[data-split="cardio"]{--split-color:var(--cardio)}
.splitpick[data-split="other"]{--split-color:var(--other)}
.splitpick[data-split="upper"]{--split-color:var(--upper)}
.splitpick[data-split="lower"]{--split-color:var(--lower)}
.splitpick[data-split="full"]{--split-color:var(--full)}
.splitchev{width:16px;height:16px;margin-left:auto;color:var(--ink-3);flex:none;pointer-events:none;
  transition:transform .16s ease}
.splitchev path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.splittrigger[aria-expanded="true"] .splitchev{transform:rotate(180deg)}
.splitmenu{position:absolute;z-index:6;top:calc(100% + 6px);left:0;right:0;padding:6px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 12px 28px rgba(10,11,14,.18)}
.splitmenu[hidden]{display:none}
.splitoption{width:100%;min-height:42px;display:flex;align-items:center;gap:10px;padding:0 10px;
  border:0;border-radius:7px;background:transparent;color:var(--ink-2);text-align:left}
.splitoption:hover,.splitoption:focus-visible,.splitoption[aria-selected="true"]{
  background:var(--surface-2);color:var(--ink)}
.splitoption:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.splitoption .splitdot{background:var(--option-color)}
.splitoption[data-split="push"]{--option-color:var(--push)}
.splitoption[data-split="pull"]{--option-color:var(--pull)}
.splitoption[data-split="legs"]{--option-color:var(--legs)}
.splitoption[data-split="cardio"]{--option-color:var(--cardio)}
.splitoption[data-split="other"]{--option-color:var(--other)}
.splitoption[data-split="upper"]{--option-color:var(--upper)}
.splitoption[data-split="lower"]{--option-color:var(--lower)}
.splitoption[data-split="full"]{--option-color:var(--full)}
.splitoption .splitoptionlabel{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.04em}
.splitcheck{margin-left:auto;color:var(--accent);font-size:17px;line-height:1;opacity:0}
.splitoption[aria-selected="true"] .splitcheck{opacity:1}

.excard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);
  border-radius:12px;padding:14px;margin-bottom:10px}

<div id="app">
  <div id="view"></div>
  <div class="bar" id="bar"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <header><input class="search" id="q" placeholder="Search or name a new exercise" autocomplete="off"></header>
    <div class="sheetscroll" id="picklist"></div>
  </div>
  <div class="scrim" id="dscrim"></div>
  <div class="dialog" id="dialog" role="alertdialog" aria-modal="true"></div>
</div>

<script>
"use strict";

/* ---------- exercise kinds ----------
   Every exercise is one of four kinds; a set is an array of numbers
   matching that kind's field list, so lifting and cardio share all the
   same plumbing (history, prefill, last-time chips, charts).           */
var KINDS={
  lift:{
    fields:[{label:"Reps",step:1,unit:"reps"},{label:"Weight (lb)",step:5,unit:"lb"}],
    metric:"1RM"
  },
  machine:{
    fields:[{label:"Minutes",step:5,unit:"min"},{label:"Level",step:1,unit:"lvl"}],
    metric:"time"
  },
  tread:{
    fields:[{label:"Minutes",step:5,unit:"min"},{label:"Speed (mph)",step:.5,unit:"mph"},
            {label:"Incline %",step:.5,unit:"%"}],
    metric:"time"
  },
  hold:{
    fields:[{label:"Seconds",step:5,unit:"sec"},{label:"Weight (lb, optional)",step:5,unit:"lb"}],
    metric:"time"
  }
};
var CARDIO_LIB=[
  {name:"Stationary Bike",kind:"machine"},
  {name:"Elliptical",kind:"machine"},
  {name:"Treadmill Walk",kind:"tread"},
  {name:"Treadmill Run",kind:"tread"},
  {name:"Rower",kind:"machine"},
  {name:"Stair Climber",kind:"machine"}
];
var LIB_KIND={}; CARDIO_LIB.forEach(function(c){LIB_KIND[c.name]=c.kind;});
function kindOf(x){return x.kind||LIB_KIND[x.name]||"lift";}
function isCardio(k){return k==="machine"||k==="tread";}

/* Library of movements, classified. Anything you've already logged is
   pulled out of here automatically, so the picker never lists it twice. */
var EXTRA = {
  push:["Barbell Bench Press","Dumbbell Bench Press","Incline Dumbbell Press","Decline Bench",
        "Chest Press","Cable Fly","Dumbbell Fly","Dips","Push Up",
        "Overhead Press","Seated Dumbbell Press","Machine Shoulder Press",
        "Cable Lateral Raise","Front Raise","Upright Row",
        "Close Grip Bench","Skullcrusher","Overhead Tricep Extension",
        "Dumbbell Tricep Extension","Tricep Kickback"],
  pull:["Deadlift","Barbell Row","Pendlay Row","T-Bar Row","Chest Supported Row",
        "One-Arm Dumbbell Row","Dumbbell Reverse Fly","Dumbbell Shrug",
        "Pull Up","Chin Up","Straight Arm Pulldown","Dumbbell Pullover","Face Pull","Shrug",
        "Barbell Curl","Hammer Curl","Incline Dumbbell Curl","Cable Curl","Concentration Curl"],
  legs:["Leg Press","Hack Squat","Front Squat","Goblet Squat","Dumbbell Squat",
        "Sumo Dumbbell Squat","Bulgarian Split Squat","Walking Lunge","Dumbbell Lunge",
        "Reverse Lunge","Step Up","Dumbbell Step Up",
        "Romanian Deadlift","Dumbbell Romanian Deadlift","Good Morning","Hip Thrust","Glute Bridge",
        "Seated Leg Curl","Seated Calf Raise","Adductor Machine","Abductor Machine"],
  other:["Plank","Side Plank","Ab Wheel","Hanging Leg Raise","Cable Crunch",
         "Russian Twist","Sit Up","Pallof Press","Back Extension",
         "Farmer Carry","Dumbbell Thruster","Renegade Row"]
};
LIB_KIND["Plank"]="hold"; LIB_KIND["Side Plank"]="hold";
/* ---------- crew ----------
   Who you are, and who the crew is, both come from the server now: `SY.user`
   for you, and the feed items themselves for everyone else. There are no
   fixture people any more — an empty crew tab means nobody has shared yet,
   which is the truth rather than a decorated placeholder. */
var FEEDP={};              /* user id -> {id,name,person} , built from the feed */
/* Person colours are deliberately off the bumper-plate hues so a disc never
   reads as a split. Assigned by sorted position rather than by hashing the id:
   there are only three slots, and a hash happily drops a three-person family
   into the same colour. Sorted order is stable across devices because the feed
   is, and it guarantees distinct colours for the first three people. */
function buildPeople(items,people,crew){
  var names={}, ids=[];
  function add(id,name){
    if(SY.user&&id===SY.user.id) return;      /* you are never a crew colour */
    if(!names[id]){ names[id]=name||id; ids.push(id); }
  }
  /* the roster first, so a colour is fixed by who is on the crew rather than
     by who happens to have shared today */
  if(crew) crew.forEach(function(c){ add(c.id,c.name); });
  items.forEach(function(x){ add(x.who,x.name); });
  /* the feed rows only name people who SHARED; `people` also covers someone
     who has only ever liked or commented, who would otherwise render as a
     raw row id */
  if(people) Object.keys(people).forEach(function(id){ add(id,people[id].name); });
  ids.sort();
  var map={};
  ids.forEach(function(id,i){
    map[id]={id:id,name:names[id],person:"p"+((i%3)+1)};
  });
  return map;
}
var GROUP_LABEL={push:"Push movements",pull:"Pull movements",
  legs:"Legs movements",other:"Core &amp; other"};
var SPLITS=[["push","Push"],["pull","Pull"],["legs","Legs"],["upper","Upper"],
  ["lower","Lower"],["full","Full Body"],["cardio","Cardio"],["other","Other"]];
var SPLIT_NAME={push:"Push",pull:"Pull",legs:"Legs",upper:"Upper",lower:"Lower",
  full:"Full Body",cardio:"Cardio",other:"Other"};
/* The real current day, in the user's own timezone, recomputed per call so a
   page left open overnight rolls over. Deliberately NOT toISOString(): that is
   UTC, which files a 7pm workout in the US under tomorrow's date. */
function p2(n){return (n<10?"0":"")+n;}
function today(){var d=new Date();
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}

/* ---------- state ----------
   The store is keyed by ACCOUNT: "racklog.proto.v2:<user id>". This is a
   family app on shared phones, so a bare per-device key meant the next person
   to pick up the handset saw — and on their next sync uploaded — the
   previous person's workouts. Namespacing is what makes "Mine" mean mine.

   The bare key is still the signed-out / standalone store: file://, the
   published artifact, the tests. The first account to sign in on a device
   that has one ADOPTS it, once, so nobody loses history logged before
   accounts existed. See HANDOFF trap 5 before changing either key. */
var KEY="racklog.proto.v2", SKEY="racklog.sync.v1";
var KEYNOW=KEY, SKEYNOW=SKEY;
function storeKey(uid){ return uid?KEY+":"+uid:KEY; }
function syncKey(uid){ return uid?SKEY+":"+uid:SKEY; }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
/* A new device starts EMPTY. Signing in pulls your own history down; the
   crew tab fills from the server. Nothing is invented locally. */
function blank(){ return {sessions:[],live:null,tab:"history",home:"mine",
  month:today().slice(0,7),social:{},autoShare:true}; }
var S=blank(), view={name:"home"}, openThread=null;

/* Swap the whole local store over to one account. Called from syncBoot, and
   again on sign-in and sign-out — nothing else may touch KEYNOW. */
function loadStore(uid){
  KEYNOW=storeKey(uid); SKEYNOW=syncKey(uid);
  var raw=lsGet(KEYNOW), sy=lsGet(SKEYNOW), adopt=false;
  if(!raw&&uid){ raw=lsGet(KEY); sy=lsGet(SKEY); adopt=!!(raw&&raw.sessions); }
  S=(raw&&raw.sessions)?raw:blank();
  /* Month selection is navigation state, not account data. An old saved month
     must not make a fresh launch claim that last month is current. */
  S.month=today().slice(0,7);
  /* filled in place rather than by bumping the key, which would wipe real
     logged workouts (HANDOFF trap 5). Do the same for the next field. */
  if(!S.social) S.social={};
  if(S.autoShare===undefined) S.autoShare=true;
  /* the calendar is home: every launch opens there, whatever tab you left on,
     and on Mine rather than the crew feed */
  S.tab="history"; S.home="mine";
  SY.since=(sy&&sy.since)||0; SY.shadow=(sy&&sy.shadow)||{};
  if(adopt){ saveLocal(); saveSync(); lsDel(KEY); lsDel(SKEY); }
}
/* Wipe one account's local copy. Only ever called on sign-out, and only once
   everything has reached the server — see signOut(). */
function forget(uid){ lsDel(storeKey(uid)); lsDel(syncKey(uid)); }

/* saveLocal persists; save() also schedules a sync. Likes and comments use
   saveLocal, because they post themselves and then ask for the sync — a
   debounced pull firing before the POST landed would revert them on screen. */
function saveLocal(){ try{ localStorage.setItem(KEYNOW,JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); syncSoon(); }

/* ---------- sync ----------
   The app works with no server at all: from file://, from the artifact, or
   signed out. API stays false in those cases and every function below is a
   no-op, which is what keeps rack-log.html standalone.

   Nothing here tracks dirty state at the call sites. Instead SY.shadow holds
   the last JSON we know the server has, per session id, and dirtyOps() diffs
   against it. That is why none of the fifteen mutation paths had to change:
   they all end in save(), and save() is enough. */
var SY={since:0,shadow:{},user:null,google:false,feed:[],crew:[],
        counts:{following:0,followers:0},notifications:[],unread:0};
var PUSH={enabled:false,busy:false,msg:""};
function saveSync(){ try{ localStorage.setItem(SKEYNOW,
  JSON.stringify({since:SY.since,shadow:SY.shadow})); }catch(e){} }

var API=null;              /* null = not checked, false = no server, true = server */
/* An invite link is a real URL -- it gets texted to people -- so the code
   arrives on location.pathname, not in a field somebody types. */
var JOIN={code:"",state:"",from:null,error:""};
/* which half of the front door is showing. "new" is the default behind an
   invite link -- somebody following one usually does not have an account. */
var GATE={mode:"in"};
function gateMode(m){GATE.mode=m;render();}
var INV={list:null,fresh:null,msg:""};
/* Finding somebody to follow. `people` is null until a search has answered,
   which is what tells "searching" apart from "nobody matches". */
var FIND={q:"",people:null};
var findSeq=0;
function joinCode(){
  if(typeof location==="undefined") return "";
  var m=String(location.pathname||"").match(/^\/join\/([a-f0-9]{32})$/);
  return m?m[1]:"";
}
/* Checked before the form is drawn, so an expired link says so instead of
   asking a stranger to pick a username and then refusing them. */
function checkInvite(){
  JOIN.code=joinCode();
  if(!JOIN.code) return;
  /* somebody arriving on a link is usually new here */
  if(!SY.user) GATE.mode="new";
  JOIN.state="checking";
  apiFetch("/api/invite/"+JOIN.code).then(function(j){
    JOIN.state="ok"; JOIN.from=j.from||null; render();
  },function(e){
    JOIN.state="bad"; JOIN.error=(e&&e.message)||"That invite link is not valid."; render();
  });
}
var syncing=false, syncMsg="", syncTimer=null;

/* key order is fixed here so a round trip never looks like a change and
   re-uploads itself on every sync */
function sjson(x){ return JSON.stringify({id:x.id,date:x.date,split:x.split,
  ex:x.ex,shared:!!x.shared,from:x.from||null}); }
function idxOf(id){ for(var i=0;i<S.sessions.length;i++)
  if(S.sessions[i].id===id) return i; return -1; }

function apiFetch(path,opts){
  opts=opts||{}; opts.credentials="same-origin"; opts.headers=opts.headers||{};
  if(opts.body) opts.headers["Content-Type"]="application/json";
  return fetch(path,opts).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok){ var e=new Error(j.error||("HTTP "+r.status)); e.status=r.status; throw e; }

function syncBoot(){

    return solo();

function dirtyOps(){
  var ops=[], seen={};
  S.sessions.forEach(function(x){ seen[x.id]=1; var j=sjson(x);
    if(SY.shadow[x.id]!==j) ops.push({op:"put",id:x.id,body:x,j:j}); });
  Object.keys(SY.shadow).forEach(function(id){
    if(!seen[id]) ops.push({op:"del",id:id}); });
  return ops;
}
/* returns the round trip, so a caller -- and the test suite -- can wait on it */
function sync(){
  if(API!==true||!SY.user||syncing) return Promise.resolve();
  syncing=true;
  var ops=dirtyOps(), pending={}, chain=Promise.resolve();
  ops.forEach(function(o){ pending[o.id]=1; chain=chain.then(function(){
    var u="/api/sessions/"+encodeURIComponent(o.id);
    return o.op==="put"
      ? apiFetch(u,{method:"PUT",body:JSON.stringify(o.body)}).then(function(){ SY.shadow[o.id]=o.j; })
      : apiFetch(u,{method:"DELETE"}).then(function(){ delete SY.shadow[o.id]; });
  });});
  return chain.then(function(){ return apiFetch("/api/sessions?since="+SY.since); })
    .then(function(j){
      var changed=false;
      (j.sessions||[]).forEach(function(r){
        if(pending[r.id]) return;       /* a local edit we just pushed wins */
        var i=idxOf(r.id);
        if(r.deleted){ if(i>=0){ S.sessions.splice(i,1); changed=true; }
          delete SY.shadow[r.id]; return; }
        var clean={id:r.id,date:r.date,split:r.split,ex:r.ex};
        if(r.shared) clean.shared=true;
        if(r.from) clean.from=r.from;
        var j2=sjson(clean);
        if(i<0){ S.sessions.push(clean); changed=true; }
        else if(sjson(S.sessions[i])!==j2){ S.sessions[i]=clean; changed=true; }
        SY.shadow[r.id]=j2;
      });
      SY.since=j.now||SY.since; syncMsg=""; saveSync();
      if(changed) saveLocal();
      return apiFetch("/api/feed").then(function(f){
        SY.feed=f.items||[];
        SY.crew=f.crew||[];
        SY.counts=f.counts||{following:0,followers:0};
        SY.unread=Number(f.unread||0);
        /* The server owns engagement now. S.social is a cache of what it last
           said, kept only so the feed still draws while offline; it is
           replaced wholesale, never merged. */
        if(f.social) S.social=f.social;
        FEEDP=buildPeople(SY.feed,f.people,SY.crew);
        saveLocal();
        syncing=false;
        /* never re-render a session in progress: it would wipe the stepper
           values that have been typed but not added yet */
        if(view.name!=="session") render();
      },function(){ syncing=false;
        if((changed||view.name==="data")&&view.name!=="session") render(); });
    },function(e){
      syncing=false; saveSync();
      if(e&&e.status===401){ SY.user=null; syncMsg="Signed out. Sign in again to sync."; }
      else syncMsg="Offline. Your workouts are safe on this device, and go up "+
        "on their own when you are back.";

    });
}

function afterAuth(){

function signIn(){

/* Sign-out has to leave the handset clean, because the next person to sign in
   is a different member of the family. Order matters: flush what is queued,
   drop the server token, and only then delete this account's local copy. If
   the flush did not clear — offline, or the server refused — the copy STAYS,
   because losing a logged workout is worse than leaving it on disk under a
   key no other account opens. */

   wipe it with the rest of the local store and nothing on the server would

function askSignOut(){

  confirmDialog("Sign out mid-workout?",
    n ? "Your live "+SPLIT_NAME[l.split]+" workout has <b>"+n+"</b> set"+(n===1?"":"s")+
        " logged. It has not been saved, and signing out clears this device."
      : "Your live "+SPLIT_NAME[l.split]+" workout hasn’t been saved. Signing out clears it.",
    "Sign out anyway","Keep logging",signOut);

function signOut(){
  var uid=SY.user?SY.user.id:null;
  var after=function(clean){
    var done=function(){
      if(clean&&uid) forget(uid);
      SY.user=null; SY.feed=[]; SY.crew=[]; FEEDP={}; SY.since=0; SY.shadow={};
      SY.counts={following:0,followers:0}; FIND={q:"",people:null};
      syncMsg=clean?"":"Some changes hadn\u2019t uploaded yet, so they were kept on this device.";
      S=blank(); KEYNOW=storeKey(null); SKEYNOW=syncKey(null);
      openThread=null; view={name:"home"}; render();
    };
    return apiFetch("/api/logout",{method:"POST"}).then(done,done);
  };

                     function(){ return after(false); });

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function jstr(s){return esc(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function fmt(n){return Number.isInteger(n)?n:Math.round(n*10)/10;}
function e1rm(r,w){return w*(1+r/30);}
function best(sets){var b=null;sets.forEach(function(s){var v=e1rm(s[0],s[1]);
  if(!b||v>b.v)b={v:v,r:s[0],w:s[1]};});return b;}
function heaviest(sets){var b=null;sets.forEach(function(s){if(!b||s[1]>b[1])b=s;});return b;}
function minutes(sets){var m=0;sets.forEach(function(s){m+=s[0]||0;});return m;}
function seconds(sets){var n=0;sets.forEach(function(s){n+=s[0]||0;});return n;}
function holdTime(n){return n>=60?(Math.floor(n/60)+"m "+(n%60?n%60+"s":"")).trim():n+" sec";}
function topLevel(sets){var l=0;sets.forEach(function(s){l=Math.max(l,s[1]||0);});return l;}
function hhmm(m){return m>=60?(Math.floor(m/60)+"h "+(m%60?(m%60)+"m":"")).trim():m+" min";}
function dstr(d,long){var dt=new Date(d+"T12:00:00");

    :{weekday:"short",month:"short",day:"numeric"});}
function ago(d){var n=Math.round((new Date(today()+"T12:00:00")-new Date(d+"T12:00:00"))/864e5);
  return n<=0?"today":n===1?"yesterday":n+" days ago";}

function historyOf(name){var out=[];
  sorted().forEach(function(s){s.ex.forEach(function(x){
    if(x.name===name&&x.sets.length)
      out.push({sid:s.id,date:s.date,split:s.split,sets:x.sets,kind:kindOf(x),
        exSplit:x.split||null});});});

function priorTo(name,s){var h=historyOf(name),i;
  for(i=0;i<h.length;i++) if(h[i].sid!==s.id && h[i].date<=s.date) return h[i];
  return null;}
function exerciseIndex(){var m=new Map();
  sorted().forEach(function(s){s.ex.forEach(function(x){
    if(!x.sets.length)return;
    var k=kindOf(x);
    /* an exercise carries its own classification; older entries fall back
       to the split of the day they were logged on */
    var sp=x.split||(isCardio(k)?"cardio":s.split);
    if(!m.has(x.name))m.set(x.name,{name:x.name,split:sp,kind:k,last:s.date,n:0,top:0,mins:0,secs:0});
    var e=m.get(x.name); e.n++;

/* ---------- month helpers ---------- */

function initials(n){

/* Search stays exact for short fragments, but forgives one typo in a longer
   word: "dumbell" finds "dumbbell" without making "row" match everything. */
function oneEditApart(a,b){
  if(Math.abs(a.length-b.length)>1)return false;
  var i=0,j=0,diffs=0;
  while(i<a.length&&j<b.length){
    if(a.charAt(i)===b.charAt(j)){i++;j++;continue;}
    if(++diffs>1)return false;
    if(a.length>b.length)i++; else if(b.length>a.length)j++; else{i++;j++;}
  }
  return diffs+(i<a.length||j<b.length?1:0)<=1;
}
function searchMatch(text,query){
  var hay=String(text||"").toLowerCase(), q=String(query||"").trim().toLowerCase();
  if(!q)return true;
  var words=hay.split(/[^a-z0-9]+/).filter(Boolean);
  return q.split(/\s+/).every(function(term){
    if(hay.indexOf(term)>=0)return true;
    return term.length>=5&&words.some(function(word){return oneEditApart(word,term);});
  });
}

  });
  if(!order.length)return '<div class="empty">No workouts logged yet.</div>';
  return order.map(function(m){
    var open=!collapsedLogMonths[m], ss=groups[m];
    return '<section class="logmonth"><button class="logmonthtoggle" aria-expanded="'+open+
      '" onclick="toggleLogMonth(\''+m+'\',this)"><span class="label">'+monthLabel(m)+
      '</span><span class="meta">'+plural(ss.length,"workout")+
      '<span class="chev">&#9660;</span></span></button>'+
      '<div class="list"'+(open?'':' hidden')+'>'+ss.map(sessionCard).join("")+'</div></section>';
  }).join("");
}
function toggleLogMonth(m,button){
  if(collapsedLogMonths[m])delete collapsedLogMonths[m]; else collapsedLogMonths[m]=true;
  /* This is deliberately an in-place toggle. Re-rendering shortens the page
     before its scroll offset is restored, which makes mobile browsers jump. */
  if(button&&button.nextElementSibling){
    var open=!collapsedLogMonths[m];
    button.setAttribute("aria-expanded",String(open));
    button.nextElementSibling.hidden=!open;
  }else render();
}
function calendar(){
  var m=S.month, first=calendarStartMonth(), last=ym(today());
  if(m<first||m>last)m=last;
  return calendarMonth(m)+'<h2 class="loghead">Workout log</h2>'+workoutLog();
}

/* A shared session, as the crew sees it: the same card the calendar screen
   uses, with the person's disc where your own card carries the date. It is a
   div, not a button -- the whole session is already on the card, so there is
   nothing to open. */
/* Who is in the crew, drawn above the feed. It answers the question an empty
   feed cannot: nobody is missing, there is simply nobody else yet. Since the
   follow graph landed, "your crew" is the people you follow -- you first, then
   them in the order you followed them. */
function crewRoster(){
  var crew=SY.crew||[];
  if(!crew.length) return "";
  var discs=crew.map(function(c){
    var me=!!(SY.user&&c.id===SY.user.id);
    var p=me?"me":((FEEDP[c.id]||{}).person||"p1");
    return '<span class="who" data-person="'+p+'">'+
      '<span class="avatar">'+esc(c.initials||initials(c.name))+'</span>'+
      '<span class="nm">'+esc(firstName(c.name))+'</span>'+
      (me?'<span class="you">You</span>':'')+'</span>';
  }).join("");
  var c=SY.counts||{following:0,followers:0};
  return '<div class="roster"><div class="eyebrow">'+
    (crew.length===1?'Your crew':'Your crew &middot; '+plural(c.following,"following")+
      ' &middot; '+plural(c.followers,"follower"))+
    '</div><div class="rosterrow">'+discs+'</div>'+
    (crew.length===1
      ? '<p class="rosternote">It is just you so far. Search for somebody above, '+
        'or send an invite link &mdash; a link makes the two of you follow each '+
        'other, and it expires after 48 hours.</p>'
      : '')+'</div>';
}
function crewHTML(){
  var tools=crewTools()+inviteFreshHTML();
  /* searching takes over the tab: the roster and the feed are about people you
     already follow, and neither answers "where is Sam" */
  if(FIND.q.trim()) return tools+'<div id="findlist">'+findHTML()+'</div>';
  var items=crewFeed(), top=tools+crewRoster();
  if(!items.length){
    if(API===false) return '<div class="empty">The crew feed needs the server.<br>'+
      'This copy runs on its own.</div>';
    return top+'<div class="empty">Nothing here yet.<br>'+
      (SY.crew&&SY.crew.length>1
        ? 'Finish a workout, or wait for somebody you follow to share one.'
        : 'Follow somebody, or finish a workout and share it.')+'</div>';
  }
  return top+'<div class="list">'+items.map(function(s){
    var p=personOf(s.who), t=totals(s), parts=[ago(s.date), plural(s.ex.length,"exercise")];
    if(t.hasLift) parts.push(plural(t.sets,"set"),
      '<span class="num">'+Math.round(t.vol).toLocaleString()+'</span> lb');
    if(t.hasCardio) parts.push('<span class="num">'+t.mins+'</span> min cardio');
    return '<div class="card" data-split="'+s.split+'">'+
      '<div class="rowbetween"><div class="who" data-person="'+p.person+'">'+
        '<span class="avatar">'+esc(initials(p.name))+'</span>'+
        '<span class="nm">'+esc(firstName(p.name))+'</span>'+
        (s.mine?'<span class="you">You</span>':'')+
      '</div><span class="chip">'+SPLIT_NAME[s.split]+'</span></div>'+
      lineage(s)+
      '<div class="sessionmeta">'+parts.join(" &middot; ")+'</div>'+
      '<div class="exlist">'+s.ex.map(function(x){
        return '<div class="exline"><b>'+esc(x.name)+'</b><span>'+
          exSummary(kindOf(x),x.sets)+'</span></div>';
      }).join("")+'</div>'+socialHTML(s)+'</div>';}).join("")+'</div>';
}
/* ---------- finding people, and following them ----------
   Instant, like Twitter: the button is a write, not a request. Somebody you
   follow shows up on your crew tab; somebody who follows YOU sees whatever
   you have marked Shared. */
function paint(id,html){var e=document.getElementById(id); if(e) e.innerHTML=html;}
function crewTools(){
  if(API!==true||!SY.user) return "";
  return '<div class="crewbar">'+
    '<input class="search" id="findq" placeholder="Find people" autocomplete="off" '+
      'spellcheck="false" value="'+esc(FIND.q)+'" oninput="findPeople()">'+
    '<button class="btn ghost" onclick="newInvite()">Invite</button></div>';
}
function findPeople(){
  var el=document.getElementById("findq");
  var was=FIND.q.trim()!=="";
  FIND.q=el?String(el.value||""):"";
  var now=FIND.q.trim()!=="";
  /* an emptied box goes back to the roster and the feed */
  if(!now){ FIND.people=null; findSeq++; return render(); }
  /* the first keystroke swaps the screen; the rest only redraw the results,
     or the box would lose focus on every letter -- same rule as the exercise
     search, for the same reason */
  FIND.people=null;
  if(!was) render(); else paint("findlist",findHTML());
  var n=++findSeq;
  apiFetch("/api/users?q="+encodeURIComponent(FIND.q.trim())).then(function(j){
    if(n!==findSeq) return;              /* a later keystroke already won */
    FIND.people=j.people||[]; paint("findlist",findHTML());
  },function(){
    if(n!==findSeq) return;
    FIND.people=[]; paint("findlist",findHTML());
  });
}
function findHTML(){
  if(FIND.people===null) return '<p class="rosternote">Searching\u2026</p>';
  if(!FIND.people.length)
    return '<p class="rosternote">Nobody matching \u201c'+esc(FIND.q.trim())+'\u201d.</p>';
  return '<div class="findlist">'+FIND.people.map(function(u){
    var per=u.mine?"me":((FEEDP[u.id]||{}).person||"p1");
    return '<div class="findrow"><span class="who" data-person="'+per+'">'+
      '<span class="avatar">'+esc(u.initials||initials(u.name))+'</span>'+
      '<span><span class="nm">'+esc(u.name)+'</span>'+
      '<span class="at">@'+esc(u.username)+'</span></span></span>'+
      (u.mine?'<span class="you">You</span>'
        :'<button class="follow'+(u.following?' on':'')+'" aria-pressed="'+!!u.following+
         '" onclick="toggleFollow(\''+jstr(u.id)+'\')">'+
         (u.following?'Following':'Follow')+'</button>')+'</div>';
  }).join("")+'</div>';
}
/* Optimistic, like the like button: the tap shows immediately and the sync
   that follows is what makes it true. A refusal puts it back. */
function toggleFollow(id){
  var row=(FIND.people||[]).filter(function(u){return u.id===id;})[0];
  if(!row) return;
  var on=!row.following;
  row.following=on; paint("findlist",findHTML());
  apiFetch("/api/follow",{method:"POST",body:JSON.stringify({id:id,on:on})})
    .then(function(){ sync(); },
          function(){ row.following=!on; paint("findlist",findHTML()); });
}

/* where a workout came from, or how far it travelled */
function lineage(s){
  if(s.from) return '<div class="fromline">&#8635; '+
    esc(firstName(personOf(s.from.who).name))+'&rsquo;s '+SPLIT_NAME[s.from.split]+' day</div>';
  var n=repeats(s.id);
  return n ? '<div class="fromline">&#8635; Done by '+n+
    (n===1?' other':' others')+'</div>' : '';
}
function socialHTML(s){
  var e=soc(s.id), open=openThread===s.id, mine=liked(s.id);
  var row='<div class="social">'+
    '<button class="act'+(mine?' on':'')+'" aria-pressed="'+mine+
      '" onclick="toggleLike(\''+jstr(s.id)+'\')">&hearts;'+
      (e.likes.length?' <span class="n">'+e.likes.length+'</span>':'')+'</button>'+
    '<button class="act'+(open?' on':'')+'" aria-expanded="'+open+
      '" onclick="toggleThread(\''+jstr(s.id)+'\')">Reply'+
      (e.comments.length?' <span class="n">'+e.comments.length+'</span>':'')+'</button>'+
    '<button class="act grow" onclick="doWorkout(\''+jstr(s.id)+'\')">'+
      (s.mine?'Do it again':'Do this workout')+'</button></div>';
  if(!open) return row;
  var thread=e.comments.map(function(c){
    var p=personOf(c.who);
    return '<div class="cmt" data-person="'+p.person+'">'+
      '<span class="avatar">'+esc(initials(p.name))+'</span>'+
      '<div class="body"><b>'+esc(firstName(p.name))+'</b>'+esc(c.text)+'</div></div>';}).join("");
  return row+'<div class="thread">'+thread+
    '<div class="cbox"><input id="c_'+esc(s.id)+'" placeholder="Say something" '+
      'autocomplete="off" onkeydown="if(event.key===\'Enter\')addComment(\''+jstr(s.id)+'\')">'+
    '<button onclick="addComment(\''+jstr(s.id)+'\')">Post</button></div></div>';
}

function renderHome(){
  var body;
  if(S.tab==="history"){
    /* Mine/Crew shares the home slot, so the calendar stays the landing view
       and the bottom nav keeps its three targets */
    var seg='<div class="seg">'+
      '<button aria-pressed="'+(S.home==="mine")+'" onclick="setHome(\'mine\')">Mine</button>'+ 
      '<button aria-pressed="'+(S.home==="crew")+'" onclick="setHome(\'crew\')">Crew</button></div>';
    if(S.home==="crew") return renderHomeShell(seg+crewHTML());
    body = seg + calendar();
  } else {
    body='<input class="search exq" id="exq" placeholder="Search exercises" '+
      'autocomplete="off" value="'+esc(exQuery)+'" oninput="filterExercises()">'+
      '<div id="exlist">'+exerciseListHTML()+'</div>';
  }
  return renderHomeShell(body);
}
/* The list is built on its own so typing can redraw it WITHOUT a full render:
   a render replaces the header too, and the search box would lose focus after
   every keystroke. */
var exQuery="";
function exerciseListHTML(){
  var q=exQuery.trim().toLowerCase();
  var idx=Array.from(exerciseIndex().values())
    .filter(function(e){ return searchMatch(e.name,q); })
    .sort(function(a,b){return b.last.localeCompare(a.last);});
  if(!idx.length) return '<div class="empty">'+(q
    ? 'Nothing logged matches &ldquo;'+esc(exQuery)+'&rdquo;.'
    : 'No movements yet.<br>Finish a workout and they collect here.')+'</div>';
  return '<div class="list">'+idx.map(function(e){
    var meta = isCardio(e.kind)
      ? hhmm(e.mins)+' logged'
      : 'best est. 1RM <span class="num">'+Math.round(e.top)+'</span> lb';
    return '<button class="card" data-split="'+(isCardio(e.kind)?"cardio":e.split)+
      '" onclick="openExercise(\''+jstr(e.name)+'\')">'+
      '<div class="rowbetween"><h2>'+esc(e.name)+'</h2><span class="dot"></span></div>'+
      '<div class="sessionmeta">'+ago(e.last)+' &middot; '+e.n+' session'+(e.n>1?'s':'')+
      ' &middot; '+meta+'</div></button>';}).join("")+'</div>';
}
function filterExercises(){
  var i=document.getElementById("exq");
  exQuery=i?String(i.value||""):"";
  var l=document.getElementById("exlist");
  if(l) l.innerHTML=exerciseListHTML();
}
/* Your own name and disc open the data screen. Signed out — which only
   happens with no server at all — it falls back to the old text button,
   because there is nobody to name. */
function userChip(){
  if(!SY.user) return '<button class="back" onclick="openData()">Data</button>';
  var badge=SY.unread?'<span class="notifybadge">'+(SY.unread>99?'99+':SY.unread)+'</span>':'';
  return '<button class="userbtn" onclick="openNotifications()" aria-label="Notifications'+
    (SY.unread?', '+SY.unread+' unread':'')+'">'+
    '<span class="who" data-person="me"><span class="avatar">'+
      esc(initials(SY.user.name))+'</span>'+badge+'<span class="nm">'+
      esc(firstName(SY.user.name))+'</span></span></button>';
}
function renderHomeShell(body){
  /* Exercises is a screen you go INTO, so it gets a back button rather than
     the date, and the way home is the same one every other screen uses. */
  var ex = S.tab==="exercises";
  V.innerHTML='<header><div>'+
    (ex?'<button class="back" onclick="setTab(\'history\')">&lsaquo; Rack Log</button>'
       :'<div class="eyebrow">'+(S.live?'Workout in progress':dstr(today(),true))+'</div>')+
    '<h1>'+(ex?"Exercises":"Rack Log")+'</h1></div>'+
    userChip()+'</header>'+scroll(body);
  BAR.innerHTML = homeBar(true);
}
/* the persistent nav — shown on home and on an exercise page. There is no
   History button: the calendar is the landing screen, and every screen that
   leaves it carries its own way back, so a nav button to it was a second
   answer to a question already answered. A live workout replaces this with
   Resume. */
function homeBar(onHome){
  if(S.live) return '<button class="btn wide" onclick="resume()">Resume '+
    SPLIT_NAME[S.live.split]+' workout</button>';
  return '<button class="btn wide" onclick="startWorkout()">+ Start workout</button>'+
    '<button class="tab" aria-current="'+(onHome&&S.tab==="exercises")+
      '" onclick="setTab(\'exercises\')">Exercises</button>';
}

function renderSession(){
  var live = !!S.live && (!view.id || view.id===S.live.id);
  var s = live ? S.live : S.sessions.filter(function(x){return x.id===view.id;})[0];
  if(!s){ view={name:"home"}; return render(); }
  /* a finished session opens read-only; "Edit" unlocks exactly the controls a
     live workout has, so there is one set of editing affordances, not two */
  var edit = !live && !!view.edit, canEdit = live || edit;
  var t=totals(s);
  var readout = t.hasCardio && !t.hasLift && !t.hasHold
    ? {k:"Time",v:t.mins+" min"}
    : t.hasHold && !t.hasLift && !t.hasCardio
    ? {k:"Time",v:holdTime(t.secs)}
    : {k:"Volume",v:Math.round(t.vol).toLocaleString()+
        (t.hasCardio?" + "+t.mins+"m":"")+(t.hasHold?" + "+holdTime(t.secs):"")};

  var head='<div class="livehead" data-split="'+s.split+'">'+
    '<div class="rowbetween"><div><div class="eyebrow">'+
      (live?'Logging now &middot; '+dstr(s.date)
           :edit?'Editing &middot; '+dstr(s.date,true):dstr(s.date,true))+'</div>'+
      '<h2 style="margin-top:3px">'+SPLIT_NAME[s.split]+' day</h2>'+
      (s.from?'<div class="fromline">&#8635; '+
        esc(firstName(personOf(s.from.who).name))+'&rsquo;s workout</div>':'')+'</div>'+
      '<div style="text-align:right"><div class="eyebrow">'+readout.k+'</div>'+
      '<div class="num" style="font-size:17px;font-weight:700">'+readout.v+'</div></div></div>'+
    (canEdit?'<div class="splitpick" data-split="'+s.split+'">'+
      '<label class="splitlabel" for="split-select">Workout day</label>'+
      '<div class="splitselect">'+
      '<button class="splittrigger" id="split-select" type="button" aria-haspopup="listbox" '+
        'aria-expanded="false" aria-controls="split-menu" onclick="toggleSplitMenu()" '+
        'onkeydown="splitTriggerKey(event)">'+
        '<span class="splitdot" aria-hidden="true"></span>'+
        '<span class="splitvalue">'+SPLIT_NAME[s.split]+'</span>'+
        '<svg class="splitchev" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+
          '<path d="m6 9 6 6 6-6"></path></svg>'+
      '</button>'+
      '<div class="splitmenu" id="split-menu" role="listbox" aria-label="Workout day" hidden>'+
        SPLITS.map(function(p){return '<button class="splitoption" type="button" role="option" '+
          'data-split="'+p[0]+'" aria-selected="'+(s.split===p[0])+'" '+
          'onclick="setSplit(\''+p[0]+'\')" onkeydown="splitOptionKey(event)">'+
          '<span class="splitdot" aria-hidden="true"></span>'+
          '<span class="splitoptionlabel">'+p[1]+'</span>'+
          '<span class="splitcheck" aria-hidden="true">&check;</span></button>';}).join("")+
      '</div></div></div>':'')+
    '</div>';

  var cards=s.ex.map(function(x,i){
    var k=kindOf(x), spec=KINDS[k], prev=priorTo(x.name,s);
    var lastRow = prev
      ? '<div class="lastline"><span class="lastlabel">'+dstr(prev.date)+'</span>'+
        prev.sets.map(function(tt){ return canEdit
          ? '<button class="ghostset" onclick="prefill('+i+',\''+tt.join(",")+'\')">'+setChip(k,tt)+'</button>'
          : '<span class="ghostset">'+setChip(k,tt)+'</span>';}).join("")+'</div>'
      : '<div class="lastline"><span class="lastlabel">First time logging this</span></div>';

    var pb=0, topNow=0;
    if(k==="lift"){
      historyOf(x.name).forEach(function(h){ if(h.sid!==s.id) pb=Math.max(pb,best(h.sets).v); });
      topNow = x.sets.length ? best(x.sets).v : 0;
    }
    var sets = x.sets.map(function(tt,j){
      var isPr = k==="lift" && pb>0 && e1rm(tt[0],tt[1])===topNow && topNow>pb;
      return '<div class="setrow"><span class="setno">'+(j+1)+'</span>'+
        '<span class="setval">'+setHTML(k,tt)+(isPr?'<span class="pr">PR</span>':'')+'</span>'+
        (canEdit?'<button class="kill" title="Remove entry" onclick="delSet('+i+','+j+')">&times;</button>':'<span></span>')+
        '</div>';}).join("");

    /* finished sessions have no draft (finish() strips it), so editing one
       falls back to that exercise's own last set */
    var d = x.draft || (x.sets.length ? x.sets[x.sets.length-1]
                                      : spec.fields.map(function(){return 0;}));
    var entry="";
    if(canEdit){
      entry='<div class="entry'+(spec.fields.length>2?' stack':'')+'" id="entry'+i+'">'+
        spec.fields.map(function(f,j){return field(f.label,"f"+i+"_"+j,d[j],f.step);}).join("")+
        '<button class="btn addset" onclick="addSet('+i+')">Log</button></div>';
    }
    /* the card wears the exercise's own classification, so a legs movement
       slotted into a push day is visible as one */
    return '<div class="excard" data-split="'+(x.split||(isCardio(k)?"cardio":s.split))+'">'+
      '<div class="exhead"><h2>'+esc(x.name)+'</h2>'+
      (canEdit?'<button class="kill" title="Remove exercise" onclick="delEx('+i+')">&times;</button>'
           :'<button class="back" onclick="openExercise(\''+jstr(x.name)+'\')">Chart &rsaquo;</button>')+
      '</div>'+lastRow+entry+(x.sets.length?'<div class="sets">'+sets+'</div>':"")+'</div>';
  }).join("");

  var empty = s.ex.length ? "" :
    '<div class="empty">Nothing logged yet.<br>Add your first exercise below.</div>';

  V.innerHTML='<header><button class="back" onclick="goHome()">&lsaquo; Rack Log</button>'+
    (live?'<button class="back" onclick="askCancel()">Cancel workout</button>'
     :edit?'<span class="eyebrow" style="padding-bottom:2px">Editing</span>'
     :'<div class="headacts"><button class="back" onclick="toggleShare()">'+
        (s.shared?'&check; Shared':'Share to followers')+'</button>'+
        '<button class="shareicon" onclick="openWorkoutShare(\''+s.id+'\')" '+
        'aria-label="Share workout"><svg viewBox="0 0 24 24" aria-hidden="true">'+
        '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/>'+
        '<circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7l7.6-4.4M8.2 13.3l7.6 4.4"/>'+
        '</svg></button></div>')+
    '</header>'+scroll(head+cards+empty);
  BAR.innerHTML = live
    ? '<button class="btn wide ghost" onclick="openSheet()">+ Add exercise</button>'+
      '<button class="btn" onclick="finish()">Finish</button>'
    : edit
    ? '<button class="btn wide ghost" onclick="openSheet()">+ Add exercise</button>'+
      '<button class="btn" onclick="doneEditing()">Done</button>'
    : '<button class="btn wide ghost" onclick="goHome()">Back to history</button>'+
      '<button class="btn" onclick="editSession()">Edit</button>';
}
function field(label,id,val,step){
  return '<div class="field"><label for="'+id+'">'+label+'</label><div class="stepper">'+
    '<button tabindex="-1" aria-label="decrease" onclick="bump(\''+id+'\',-'+step+')">&minus;</button>'+
    '<input id="'+id+'" type="number" inputmode="decimal" step="'+step+'" value="'+(val||"")+'" '+
      'onfocus="this.select()" onclick="this.select()">'+
    '<button tabindex="-1" aria-label="increase" onclick="bump(\''+id+'\','+step+')">+</button></div></div>';
}

function renderExercise(){
  var name=view.name2, h=historyOf(name);
  if(!h.length){ view={name:"home"}; return render(); }
  var k=h[0].kind, stats, fig;

  if(k==="hold"){
    var hpts=h.slice().reverse().map(function(x){return {date:x.date,v:seconds(x.sets),
      tag:topLevel(x.sets)?fmt(topLevel(x.sets))+"lb":"bodyweight"};});
    var totalSec=0,longestSec=0;
    h.forEach(function(x){totalSec+=seconds(x.sets);x.sets.forEach(function(t){longestSec=Math.max(longestSec,t[0]||0);});});
    var lastHold=h[0].sets[h[0].sets.length-1];
    stats='<div class="statrow">'+
      '<div class="stat"><div class="eyebrow">Total time</div><div class="v">'+holdTime(totalSec)+'</div></div>'+
      '<div class="stat"><div class="eyebrow">Longest</div><div class="v">'+holdTime(longestSec)+'</div></div>'+
      '<div class="stat"><div class="eyebrow">Last weight</div><div class="v">'+fmt(lastHold[1]||0)+' <s>lb</s></div></div></div>';
    fig='<figure><figcaption><b>Seconds per session</b><span>labelled with added weight</span></figcaption>'+
      barChart(hpts)+'</figure>';
  } else if(isCardio(k)){
    var pts=h.slice().reverse().map(function(x){
      return {date:x.date, v:minutes(x.sets),
        tag: k==="machine" ? "L"+fmt(topLevel(x.sets)) : fmt(heaviest(x.sets)[1])+"mph"};});
    var total=0,longest=0;
    pts.forEach(function(p){total+=p.v;longest=Math.max(longest,p.v);});
    var lastSet=h[0].sets[h[0].sets.length-1];
    stats='<div class="statrow">'+
      '<div class="stat"><div class="eyebrow">Total time</div><div class="v">'+total+' <s>min</s></div></div>'+
      '<div class="stat"><div class="eyebrow">Longest</div><div class="v">'+longest+' <s>min</s></div></div>'+
      '<div class="stat"><div class="eyebrow">'+(k==="machine"?"Last level":"Last speed")+'</div>'+
      '<div class="v">'+fmt(lastSet[1])+' <s>'+(k==="machine"?"lvl":"mph")+'</s></div></div></div>';
    fig='<figure><figcaption><b>Minutes per session</b><span>'+
      (k==="machine"?"labelled with that day&rsquo;s level":"labelled with that day&rsquo;s speed")+
      '</span></figcaption>'+barChart(pts)+'</figure>';
  } else {
    var lpts=h.slice().reverse().map(function(x){var b=best(x.sets);
      return {date:x.date,v:b.v,b:b};});
    var pb=lpts.reduce(function(m,p){return p.v>m.v?p:m;},{v:0});
    var totalSets=0; h.forEach(function(x){totalSets+=x.sets.length;});
    stats='<div class="statrow">'+
      '<div class="stat"><div class="eyebrow">Best est. 1RM</div><div class="v">'+Math.round(pb.v)+' <s>lb</s></div></div>'+
      '<div class="stat"><div class="eyebrow">Last top set</div><div class="v">'+fmt(heaviest(h[0].sets)[1])+' <s>lb</s></div></div>'+
      '<div class="stat"><div class="eyebrow">Sets logged</div><div class="v">'+totalSets+'</div></div></div>';
    fig='<figure><figcaption><b>Estimated 1RM</b><span>'+
      (lpts.length>1?'best set of each session':'one session so far &mdash;<br>log it again to see the trend')+
      '</span></figcaption>'+lineChart(lpts)+'</figure>';
  }

  var hist='<div class="hist">'+h.map(function(x){
    return '<div class="histday" data-split="'+(isCardio(k)?"cardio":x.split)+'">'+
      '<div class="rowbetween"><span class="d">'+dstr(x.date)+'</span>'+
      '<span class="chip">'+SPLIT_NAME[x.split]+'</span></div><div class="histsets">'+
      x.sets.map(function(tt){return '<span>'+setChip(k,tt)+'</span>';}).join("")+
      '</div></div>';}).join("")+'</div>';

  V.innerHTML='<header><div><button class="back" onclick="goBack()">&lsaquo; Back</button>'+
    '<h1 style="margin-top:8px">'+esc(name)+'</h1></div></header>'+
    scroll(stats+fig+'<div class="eyebrow" style="margin:18px 0 8px">Every session</div>'+hist);
  BAR.innerHTML=homeBar(false);
}

function pushSupported(){return API===true&&SY.user&&typeof navigator!=="undefined"&&
  "serviceWorker" in navigator&&typeof PushManager!=="undefined"&&
  typeof Notification!=="undefined";}
function pushSection(){
  if(API!==true||!SY.user) return "";
  var supported=pushSupported(), denied=supported&&Notification.permission==="denied";
  var note=!supported?"Android notifications are not supported in this browser.":
    denied?"Notifications are blocked in Android settings for Rack Log.":
    "Get an Android alert when someone likes or comments on your workout. Likes are grouped to avoid noise.";
  return '<div class="datasec"><div class="eyebrow">Notifications</div><p>'+note+'</p>'+ 
    (supported&&!denied?'<button class="prefrow" aria-pressed="'+PUSH.enabled+'" '+
      (PUSH.busy?'disabled ':'')+'onclick="togglePush()"><span>Likes and comments</span><span class="prefstate">'+
      (PUSH.busy?'Working…':PUSH.enabled?'On':'Off')+'</span></button>':'')+
    '<div id="pushmsg" class="msg">'+esc(PUSH.msg)+'</div></div>';
}
function b64bytes(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4)s+="=";
  var raw=atob(s), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i); return out;
}
function refreshPush(){
  if(!pushSupported()) return Promise.resolve();
  return navigator.serviceWorker.register("/sw.js").then(function(){return navigator.serviceWorker.ready;})
    .then(function(reg){return reg.pushManager.getSubscription();})
    .then(function(sub){PUSH.enabled=!!sub;if(view.name==="data")render();},function(){});
}
function togglePush(){
  if(PUSH.busy||!pushSupported())return;
  PUSH.busy=true;PUSH.msg="";render();
  navigator.serviceWorker.register("/sw.js").then(function(){return navigator.serviceWorker.ready;})
    .then(function(reg){return reg.pushManager.getSubscription().then(function(sub){return {reg:reg,sub:sub};});})
    .then(function(x){
      if(x.sub&&PUSH.enabled) return apiFetch("/api/push",{method:"DELETE",body:JSON.stringify({endpoint:x.sub.endpoint})})
        .then(function(){return x.sub.unsubscribe();}).then(function(){PUSH.enabled=false;PUSH.msg="Notifications are off on this device.";});
      return Notification.requestPermission().then(function(permission){
        if(permission!=="granted")throw new Error("Android did not allow notifications.");
        return apiFetch("/api/push").then(function(cfg){
          if(!cfg.publicKey)throw new Error("Notifications are not ready yet.");
          return x.reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64bytes(cfg.publicKey)});
        }).then(function(sub){return apiFetch("/api/push",{method:"POST",body:JSON.stringify({subscription:sub.toJSON()})});})
          .then(function(){PUSH.enabled=true;PUSH.msg="Notifications are on for this device.";});
      });
    }).catch(function(e){PUSH.msg=(e&&e.message)||"Couldn’t change notifications.";})
    .then(function(){PUSH.busy=false;render();});
}

var CW=340,CH=152,CL=36,CR=18,CT=16,CB=26;
function xlabel(d){return dstr(d).replace(/^[A-Za-z]+, /,"");}
function lineChart(pts){
  var iw=CW-CL-CR, ih=CH-CT-CB;
  var vs=pts.map(function(p){return p.v;});
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  if(hi-lo<8){lo-=6;hi+=6;} else {var pad=(hi-lo)*.25;lo-=pad;hi+=pad;}
  function x(i){return pts.length===1?CL+iw/2:CL+iw*i/(pts.length-1);}
  function y(v){return CT+ih-(v-lo)/(hi-lo)*ih;}
  var g="",out="",i;
  for(i=0;i<=3;i++){var v=lo+(hi-lo)*i/3;
    g+='<line class="grid" x1="'+CL+'" y1="'+y(v).toFixed(1)+'" x2="'+(CW-CR)+'" y2="'+y(v).toFixed(1)+'"/>'+
       '<text class="lbl" x="'+(CL-7)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';}
  var d=pts.map(function(p,j){return (j?"L":"M")+x(j).toFixed(1)+" "+y(p.v).toFixed(1);}).join(" ");
  if(pts.length>1){
    out+='<path class="area" d="'+d+' L'+x(pts.length-1).toFixed(1)+' '+(CT+ih)+' L'+x(0).toFixed(1)+' '+(CT+ih)+' Z"/>';
    out+='<path class="ser" d="'+d+'"/>';}
  pts.forEach(function(p,j){
    out+='<circle class="pt" cx="'+x(j).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="4.5"><title>'+
      dstr(p.date)+" — "+p.b.r+"×"+fmt(p.b.w)+" lb · est. "+Math.round(p.v)+' lb</title></circle>';
    out+='<text class="lbl" x="'+x(j).toFixed(1)+'" y="'+(CH-8)+'" text-anchor="middle">'+xlabel(p.date)+'</text>';});
  var lp=pts[pts.length-1], multi=pts.length>1;
  out+='<text class="endlbl" x="'+(x(pts.length-1)-(multi?3:0)).toFixed(1)+'" y="'+(y(lp.v)-11).toFixed(1)+
    '" text-anchor="'+(multi?"end":"middle")+'">'+Math.round(lp.v)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+CW+' '+CH+'" role="img" '+
    'aria-label="Estimated one-rep max by session, most recent '+Math.round(lp.v)+' pounds">'+g+out+'</svg>';
}
function barChart(pts){
  var iw=CW-CL-CR, ih=CH-CT-CB, base=CT+ih;
  var hi=Math.max.apply(null,pts.map(function(p){return p.v;}));
  hi=Math.max(hi*1.25,10);
  function y(v){return base-v/hi*ih;}
  var slot=iw/pts.length, bw=Math.min(38,slot-8), g="",out="",i;
  for(i=0;i<=3;i++){var v=hi*i/3;
    g+='<line class="grid" x1="'+CL+'" y1="'+y(v).toFixed(1)+'" x2="'+(CW-CR)+'" y2="'+y(v).toFixed(1)+'"/>'+
       '<text class="lbl" x="'+(CL-7)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';}
  pts.forEach(function(p,j){
    var cx=CL+slot*j+slot/2, top=y(p.v), h=Math.max(base-top,2);
    out+='<rect class="barmark" x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+h.toFixed(1)+'" rx="4"><title>'+dstr(p.date)+" — "+p.v+" min · "+p.tag+'</title></rect>';
    out+='<text class="endlbl" x="'+cx.toFixed(1)+'" y="'+(top-6).toFixed(1)+'" text-anchor="middle">'+p.v+'</text>';
    out+='<text class="lbl" x="'+cx.toFixed(1)+'" y="'+(CH-16)+'" text-anchor="middle">'+xlabel(p.date)+'</text>';

      .sort(function(a,b){return (b===split?1:0)-(a===split?1:0);})
      .map(function(sp){return newItem(n,"lift",sp,SPLIT_NAME[sp],"reps &times; weight");});
    choices.push(newItem(n,"hold","other","Timed hold","seconds + optional weight"));
      choices.push(newItem(n,"machine","cardio","Cardio","time + level"));
      addHTML='<div class="grouphead eyebrow">Add &ldquo;'+esc(n)+'&rdquo; as</div>'+choices.join("");
    }
    function resultHTML(e){
      if(!e.logged)
        return item(e,isCardio(e.kind)
          ? (e.kind==="tread" ? "time, speed, incline" : "time + level") : "");
      var meta = isCardio(e.kind)
        ? ago(e.last)+" · "+minutes(historyOf(e.name)[0].sets)+" min"
        : e.kind==="hold"
        ? ago(e.last)+" · "+holdTime(seconds(historyOf(e.name)[0].sets))
        : ago(e.last)+" · top "+fmt(heaviest(historyOf(e.name)[0].sets)[1])+" lb";
      return item(e,meta);
    }
    if(dayItems.length)
      h+='<div class="grouphead eyebrow">For your '+SPLIT_NAME[split]+' day</div>'+dayItems.map(resultHTML).join("");
    h+=addHTML;
    /* Keep the remaining classifications grouped, but leave any logged
       movement beside its category's library choices. */
    var remainingGroups=libraryGroups.map(function(g){
      var items=otherItems.filter(function(e){return e.split===g.split;});
      return {split:g.split,items:items};
    }).filter(function(g){return g.items.length;});
    if(otherItems.some(function(e){return e.split==="cardio";}))
      remainingGroups.push({split:"cardio",items:otherItems.filter(function(e){return e.split==="cardio";})});
    h+=remainingGroups.map(function(g){
      var label=g.split==="cardio" ? "Cardio machines" : GROUP_LABEL[g.split];
      return '<div class="grouphead eyebrow">'+label+'</div>'+
        g.items.map(resultHTML).join("");
    }).join("");
    if(!h) h='<div class="empty">Type a name to add it.</div>';
    document.getElementById("picklist").innerHTML=h;
  }
function item(e,meta){
  return '<button class="pickitem" data-split="'+e.split+
    '" onclick="pick(\''+jstr(e.name)+'\',\''+(e.kind||"lift")+'\',\''+e.split+'\')">'+
    '<span class="dot"></span><span>'+esc(e.name)+'</span>'+(meta?'<small>'+meta+'</small>':"")+'</button>';
}
function newItem(n,kind,split,label,meta){
  return '<button class="pickitem" data-split="'+split+
    '" onclick="pick(\''+jstr(n)+'\',\''+kind+'\',\''+split+'\')">'+
    '<span class="dot"></span><span>'+label+'</span><small>'+meta+'</small></button>';
}
function pick(n,k,sp){
  var s=editable(); if(!s) return;
  var has=s.ex.some(function(x){return x.name===n;});
  if(!has){
    var prev=priorTo(n,s);
    var kind=prev?prev.kind:(k||LIB_KIND[n]||"lift");
    var split=(prev&&prev.exSplit)||sp||(isCardio(kind)?"cardio":s.split);
    var d=prev?prev.sets[0].slice():defaultDraft(kind);
    s.ex.push({name:n,kind:kind,split:split,sets:[],draft:d});
  }
  closeSheet(); save(); render();
  var at=s.ex.map(function(x){return x.name;}).indexOf(n); if(at>=0) revealEntry(at);
  setTimeout(function(){var sc=document.querySelector(".scroll");
    if(sc)sc.scrollTo({top:1e6,behavior:"smooth"});},60);
}
function defaultDraft(kind){
  if(kind==="lift") return [8,0];
  if(kind==="hold") return [30,0];
  if(kind==="machine") return [20,5];
  return [20,3.5,2];
}

render();
syncBoot();
/* Android can restore the signed-out page from its back/forward cache after a
   login round trip. A persisted page is a snapshot, not current auth truth:
   signed-in snapshots return to Home, and signed-out snapshots ask /api/me
   again instead of exposing the stale door. */
function returnFromHistory(e){
  if(!e||!e.persisted) return;
  if(SY.user){ openThread=null; goHome(); sync(); return; }
  API=null; render(); syncBoot();
}
/* Two moments are worth a sync nobody asked for: coming back to the app, and
   coming back onto the network. Everything else already syncs through save().
   There is no Sync now button -- a button that does what the app does on a
   1.2s timer is a button that exists to apologise for the app not doing it,
   and on a phone the person who needs it most is the one least likely to go
   looking for it.
   Neither event is a guarantee: a captive portal fires `online` while nothing
   can reach the worker. That is why the failure message says the workouts are
   safe rather than promising a moment, and why the next save() retries
   anyway. */
if(typeof document.addEventListener==="function")
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden) sync(); });
if(typeof addEventListener==="function")
  addEventListener("online",function(){ syncMsg=""; sync(); });
if(typeof addEventListener==="function")
  addEventListener("pageshow",returnFromHistory);
</script>
